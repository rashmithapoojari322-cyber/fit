<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tik Talk Game - Modern Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Confetti Particle Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <main class="container">
        <!-- Header -->
        <header>
            <div class="brand-title">
                <span class="tik">Tik</span><span class="talk">Talk</span>
                <span class="badge">Game</span>
            </div>
            <div class="top-actions">
                <button id="btnSoundToggle" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <button id="btnThemeToggle" class="icon-btn" title="Toggle Neon/Classic Theme" aria-label="Toggle Theme">
                    <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
                </button>
            </div>
        </header>

        <!-- Game Settings & Modes -->
        <section class="game-settings">
            <div class="mode-toggle-group">
                <button class="mode-btn active" data-mode="pvp">👥 2 Players</button>
                <button class="mode-btn" data-mode="ai">🤖 vs AI</button>
            </div>

            <div id="difficultyWrapper" class="difficulty-select-wrapper hidden">
                <span class="difficulty-label">AI Level</span>
                <div class="difficulty-options">
                    <button class="diff-btn" data-diff="easy">Easy</button>
                    <button class="diff-btn active" data-diff="medium">Medium</button>
                    <button class="diff-btn" data-diff="master">Master</button>
                </div>
            </div>
        </section>

        <!-- Scoreboard -->
        <section class="scoreboard">
            <div class="score-card player-x">
                <div class="label">Player X</div>
                <div id="scoreX" class="val">0</div>
            </div>
            <div class="score-card draws">
                <div class="label">Draws</div>
                <div id="scoreDraws" class="val">0</div>
            </div>
            <div class="score-card player-o">
                <div id="labelO" class="label">Player O</div>
                <div id="scoreO" class="val">0</div>
            </div>
        </section>

        <!-- Win Streak Banner -->
        <div class="streak-banner">
            <span>🔥 Current Streak: <strong id="streakCount">0</strong></span>
            <span>•</span>
            <span>Best: <strong id="bestStreak">0</strong></span>
        </div>

        <!-- Current Turn Status -->
        <div class="turn-status">
            <span id="turnBadge" class="turn-badge x">X</span>
            <span id="turnText">Player X's Turn</span>
        </div>

        <!-- 3x3 Game Board -->
        <div class="board-container">
            <div id="board" class="board" role="grid" aria-label="Tik Talk Game Board">
                <div class="cell" data-index="0" role="button" tabindex="0" aria-label="Cell 1, Empty"></div>
                <div class="cell" data-index="1" role="button" tabindex="0" aria-label="Cell 2, Empty"></div>
                <div class="cell" data-index="2" role="button" tabindex="0" aria-label="Cell 3, Empty"></div>
                <div class="cell" data-index="3" role="button" tabindex="0" aria-label="Cell 4, Empty"></div>
                <div class="cell" data-index="4" role="button" tabindex="0" aria-label="Cell 5, Empty"></div>
                <div class="cell" data-index="5" role="button" tabindex="0" aria-label="Cell 6, Empty"></div>
                <div class="cell" data-index="6" role="button" tabindex="0" aria-label="Cell 7, Empty"></div>
                <div class="cell" data-index="7" role="button" tabindex="0" aria-label="Cell 8, Empty"></div>
                <div class="cell" data-index="8" role="button" tabindex="0" aria-label="Cell 9, Empty"></div>
            </div>
        </div>

        <!-- Bottom Action Buttons -->
        <div class="bottom-actions">
            <button id="btnRestart" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                Restart Game
            </button>
            <button id="btnResetScores" class="btn btn-secondary">
                Reset Scores
            </button>
        </div>
    </main>

    <!-- Winner / Draw Modal -->
    <div id="resultModal" class="modal-backdrop">
        <div class="modal-card">
            <span id="modalEmoji" class="modal-emoji">🎉</span>
            <h2 id="modalTitle" class="modal-title">Player X Wins!</h2>
            <p id="modalSubtitle" class="modal-subtitle">Sensational victory!</p>
            <button id="modalPlayAgain" class="btn btn-primary" style="width: 100%;">
                Play Again
            </button>
        </div>
    </div>

    <!-- Combined Scripts -->
    <script src="script.js"></script>
</body>
</html>
